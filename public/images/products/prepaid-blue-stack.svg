<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F2A6B"/>
    </linearGradient>
    <linearGradient id="blueFacetA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueFacetB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blueShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="30" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Back card -->
  <g filter="url(#blueShadow)" transform="translate(40 70) rotate(12 200 125)">
    <rect width="400" height="250" rx="22" fill="url(#blueBody)"/>
    <polygon points="0,0 160,0 80,120" fill="url(#blueFacetA)"/>
    <polygon points="160,0 400,0 400,90 220,160" fill="url(#blueFacetB)"/>
    <polygon points="0,140 180,90 400,180 400,250 0,250" fill="#1E40AF" opacity="0.35"/>
    <rect y="38" width="400" height="44" fill="#0B1220"/>
    <rect x="40" y="108" width="210" height="34" rx="4" fill="#F8FAFC"/>
    <text x="40" y="210" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="10" opacity="0.8">AUTHORIZED SIGNATURE � PREPAID</text>
    <rect x="388" y="0" width="12" height="250" rx="2" fill="#0B1F4A" opacity="0.55"/>
  </g>

  <!-- Front card -->
  <g filter="url(#blueShadow)" transform="translate(180 110) rotate(-6 200 125)">
    <rect width="400" height="250" rx="22" fill="url(#blueBody)"/>
    <polygon points="0,0 200,0 120,140 0,90" fill="url(#blueFacetA)"/>
    <polygon points="200,0 400,0 400,110 260,170" fill="url(#blueFacetB)"/>
    <polygon points="0,160 140,110 400,200 400,250 0,250" fill="#1E3A8A" opacity="0.4"/>
    <text x="250" y="48" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">CREDIT CARD</text>
    <rect x="36" y="70" width="54" height="42" rx="6" fill="#E8C547"/>
    <rect x="42" y="76" width="42" height="30" rx="3" fill="#F5D76E" opacity="0.9"/>
    <rect x="46" y="82" width="8" height="6" rx="1" fill="#B8860B" opacity="0.45"/>
    <rect x="58" y="82" width="8" height="6" rx="1" fill="#B8860B" opacity="0.45"/>
    <rect x="70" y="82" width="8" height="6" rx="1" fill="#B8860B" opacity="0.45"/>
    <text x="36" y="160" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="22" letter-spacing="3">5412  """"  """"  3341</text>
    <text x="36" y="198" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">CARDHOLDER NAME</text>
    <text x="36" y="218" fill="#DBEAFE" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">EXP  12/27</text>
    <g transform="translate(320 185)">
